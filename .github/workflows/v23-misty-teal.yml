name: Apply V2.3 misty teal hero
on:
  push:
    paths:
      - '.github/workflows/v23-misty-teal.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace terracotta hero with misty teal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='linear-gradient(135deg,rgba(169,94,61,.98),rgba(185,104,67,.97),rgba(199,122,80,.96))'
          new='linear-gradient(135deg,rgba(66,107,115,.98),rgba(82,126,122,.97),rgba(99,141,130,.96))'
          if old not in s:
              raise SystemExit('Terracotta hero gradient not found')
          s=s.replace(old,new,1)
          s=s.replace('rgba(135,70,39,.24)','rgba(48,82,84,.24)',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v23-misty-teal.yml
          git add index.html
          git commit -m 'Design: switch core hero to misty teal V2.3'
          git push