name: Apply V2.5 header contrast

on:
  push:
    paths:
      - '.github/workflows/v25-header-contrast.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply header contrast patch
        run: python3 .github/v25_patch.py
      - name: Commit changes and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v25-header-contrast.yml .github/v25_patch.py
          git add index.html
          git commit -m "Design: strengthen header title and subtitle contrast V2.5"
          git push
