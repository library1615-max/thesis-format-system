name: Apply V2.2 terracotta hero

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v22-terracotta-hero.yml'

permissions:
  contents: write

jobs:
  apply-v22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply terracotta hero override
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* ===== V2.2 TERRACOTTA HERO ===== */'
          if marker not in s:
              css='''\n/* ===== V2.2 TERRACOTTA HERO ===== */\n.hero{\n  background:\n    linear-gradient(135deg,rgba(169,94,61,.98),rgba(185,104,67,.97),rgba(199,122,80,.96)),\n    url('./assets/hero-bg.svg');\n  border:1px solid rgba(255,255,255,.18);\n  box-shadow:0 22px 48px rgba(132,72,45,.24);\n}\n'''
              s=s.replace('</style>',css+'\n</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit V2.2 and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/v22-terracotta-hero.yml
          git commit -m "Design: V2.2 terracotta hero card"
          git push
