name: Apply V2.4 counter reliability

on:
  push:
    paths:
      - '.github/workflows/v24-counter-cache.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply counter patch
        run: python3 .github/v24_patch.py
      - name: Commit changes and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v24-counter-cache.yml .github/v24_patch.py
          git add index.html
          git commit -m "Fix: cache counter display and count only main check entry"
          git push
