name: Apply V2.1 visual hierarchy

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v21-visual-update.yml'

permissions:
  contents: write

jobs:
  apply-v21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V2.1 CSS overrides
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* ===== V2.1 VISUAL HIERARCHY ===== */'
          if marker in text:
              raise SystemExit('V2.1 already applied')
          css = base64.b64decode('').decode('utf-8')
          text = text.replace('</style>', css + '\n  </style>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit V2.1 and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/v21-visual-update.yml
          git commit -m "Design: refine V2.1 visual hierarchy"
          git push
