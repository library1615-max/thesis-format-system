name: SEO index one-time patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-index-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index SEO head only
        run: python -c "from pathlib import Path; p=Path('index.html'); t=p.read_text(encoding='utf-8-sig'); i=t.find('<style>'); assert i >= 0, 'style tag not found'; h=Path('.seo-head.tmp').read_text(encoding='utf-8'); p.write_text(h+t[i:], encoding='utf-8')"

      - name: Commit SEO update
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "SEO: optimize index metadata"
          git push
